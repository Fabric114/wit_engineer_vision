# 相机后端: hik/daheng/realsense/video
type: hik 
publish_shm: true
shm_region: ""   # 空 = 用 shm 默认区域（wit_engineer_image）

hik_camera:
  sn: "DA3038934"
  fps: 200.0
  # 输出分辨率; 共享内存槽位大小也按这里算
  width: 1440
  height: 1080
  binning: 1
  exposure_us: 8500.0
  gain: 16.0
  bayer_mode: 0
  wb_mode: "continuous"
  wb_r: 1.0
  wb_g: 1.0
  wb_b: 1.0
  # 触发: false=连续采图; true=触发模式
  trigger_enable: false
  # 触发源: software | line0 | line1 | line2 | line3
  trigger_source: "software"
  # 掉线重试间隔 / 无新帧重启超时（秒）
  retry_interval_s: 2.0
  no_frame_timeout_s: 3.0
  frame_id: "camera"
  camera_info_topic: "/camera/camera_info"
daheng_camera:
  sn: ""
  fps: 200.0
  width: 960
  height: 720
  binning: 1
  exposure_us: 3000.0
  gain: 16.0
  bayer_mode: 0
  wb_mode: "continuous"
  wb_r: 1.0
  wb_g: 1.0
  wb_b: 1.0
  trigger_enable: false
  trigger_source: "software"
  retry_interval_s: 2.0
  no_frame_timeout_s: 3.0
  frame_id: "camera"
  camera_info_topic: "/camera/camera_info"

realsense_camera:
  sn: ""            
  fps: 30.0         
  width: 640        
  height: 480
  depth: auto
  timeout_ms: 1000  # wait_for_frames 超时
  # 内参不读 camera_info.yaml, 用设备出厂标定 (对齐深度与彩色共用一份)
  retry_interval_s: 2.0
  no_frame_timeout_s: 3.0
  frame_id: "camera"
  camera_info_topic: "/camera/camera_info"
  depth_topic: "/camera/depth/image_raw"   # 16UC1, 已对齐到彩色, D435 单位 mm
depth_shm_region: ""

video_camera:
  # 视频文件路径
  path: "assets/video/test1.mp4"
  # 输出分辨率; 0 = 用视频原生分辨率
  width: 0
  height: 0
  fps: 0.0  # =0用视频文件自带帧率
  loop: true
  start_frame: 0
  no_frame_timeout_s: 3.0
  frame_id: "camera"
  camera_info_topic: "/camera/camera_info"
