# planning 包自带的示例配置 (数据驱动真值)。
#
# 【重要】其中 arm.dh / joint_limits / dynamics / tool 以及 collision 几何,
# 目前仍是参考项目 RM2026-Engineer-Assembly-Algorithm 那台臂的参数,
# 不是本仓库新 MJCF (rm26_arm) 的参数。FK/IK 要对本机器人成立,
# 必须按 rm26_arm 的 URDF/MJCF 重新标定 DH、限位、工具偏置后覆盖这里。
# planning.* / type3.* 的规划超参可直接沿用。
#
# 感知 (perception / keypoint_schemas) 一律不放这里, 归 solver/detector/tf 包,
# 保持"一处一个真值"。

